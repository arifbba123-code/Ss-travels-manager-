name: sstours_travels
description: SS Tours & Travels - Cloud Fleet Manager (multi-admin, real-time)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase — cloud backend (replaces the old local SQLite database).
  # These three (firebase_core / firebase_auth / cloud_firestore) are
  # released together by the FlutterFire team, so keeping them on their
  # current latest majors is what actually resolves cleanly — pinning
  # older individual versions is what caused the original conflict.
  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  cloud_firestore: ^6.1.2

  # Google Sign-In v7 — new singleton API (GoogleSignIn.instance),
  # see lib/services/firebase_auth_service.dart for the migrated flow.
  google_sign_in: ^7.2.0

  # Share to WhatsApp / other apps. v12 is what finally moved to the
  # same `web: ^1.x` generation as current Firebase packages — this is
  # the actual fix for the original firebase_auth/share_plus conflict.
  share_plus: ^12.0.1

  # Local device storage (used only for the "Remember me" preference —
  # no business data is stored on-device anymore)
  shared_preferences: ^2.5.0

  path_provider: ^2.1.5

  # State management
  provider: ^6.1.2

  # PDF report generation
  pdf: ^3.11.3
  printing: ^5.14.3

  # PNG image report generation
  screenshot: ^3.0.0

  # Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    - assets/splash/

# ---------------------------------------------------------------------------
# App icon generation (run: dart run flutter_launcher_icons)
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

# ---------------------------------------------------------------------------
# Splash screen generation (run: dart run flutter_native_splash:create)
# NOTE: Android 12+'s native SplashScreen API only supports a solid
# background color + a centered icon (no full-bleed background art), so the
# light-streak/city-silhouette background only renders on Android < 12
# (via android_12.color below it falls back to solid black there).
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#050506"
  image: assets/splash/splash_logo.png
  android: true
  ios: false
  android_12:
    color: "#050506"
    image: assets/splash/splash_logo.png
    icon_background_color: "#050506"
