name: sstours_travels
description: SS Tours & Travels - Offline Fleet Manager
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # State management
  provider: ^6.1.2

  # PDF report generation
  pdf: ^3.11.0
  printing: ^5.13.1

  # PNG image report generation
  screenshot: ^3.0.0

  # Share
  share_plus: ^13.3.0

  # Formatting
  intl: ^0.19.0

  # Firebase
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1

  # Google Sign In
  google_sign_in: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
    - assets/splash/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: assets/icon/app_icon_background.png
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  min_sdk_android: 23

flutter_native_splash:
  color: "#050506"
  image: assets/splash/splash_logo.png
  android: true
  ios: false

  android_12:
    color: "#050506"
    image: assets/splash/splash_logo.png
    icon_background_color: "#050506"
