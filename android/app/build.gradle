plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"

    // Firebase Google Services
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

// Optional release-signing support. If android/key.properties exists (copy it
// from key.properties.example and fill in your real keystore details), the
// release build type is signed with your upload key. When it is absent
// (e.g. on a fresh Codemagic checkout with no secrets configured yet) the
// release build type safely falls back to the debug key, exactly like
// before, so CI keeps working out of the box.
def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
def hasKeystoreProperties = keystorePropertiesFile.exists()
if (hasKeystoreProperties) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

android {
    namespace "com.sstours.sstours_travels"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Some Firebase / plugin dependencies require Java 8+ library
        // desugaring on minSdk < 26 — enabling this avoids a common
        // "requires core library desugaring" Gradle build failure.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.sstours.sstours_travels"
        // firebase_auth (>=6.x) requires minSdk 23 — raised from 21.
        minSdk 23
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // Firebase Auth + Firestore + Google Sign-In push the app past the
        // 64K method-count limit on some configurations; enabling multidex
        // keeps release builds safe regardless of ProGuard/R8 settings.
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (hasKeystoreProperties) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasKeystoreProperties ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
