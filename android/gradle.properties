org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# All plugins used by this project (Firebase, Google Sign-In, sqflite, pdf,
# printing, screenshot, share_plus) already ship AndroidX-native artifacts,
# so the legacy support-library Jetifier step is unnecessary and only slows
# the build down.
android.enableJetifier=false
